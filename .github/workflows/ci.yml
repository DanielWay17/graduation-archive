name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Secret *names* come from .dev.vars when generating Worker types; the example has dummy values.
      - run: cp .dev.vars.example .dev.vars
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploys to Cloudflare after the checks pass, only for pushes to main (never for pull requests).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the running deploy instead of racing it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://graduation-archive.nguyencongtiendung17.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Database migrations are NOT run here: the API token has no D1 permission.
      # After adding a file to migrations/, run `npm run db:migrate:remote` locally before pushing.
      - run: npm run deploy
      - name: Check the live site answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://graduation-archive.nguyencongtiendung17.workers.dev/)
            [ "$code" = 200 ] && echo "Live site OK" && exit 0
            sleep 10
          done
          echo "Live site returned $code" && exit 1
